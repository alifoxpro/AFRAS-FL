name: AFRAS V2 Stage18 locked eight-client engine and replay QA
on:
  push:
    branches:
      - research/afras-v2-stage17-source-only-pilot-20261024
    paths:
      - stage18_v2/**
      - stage16_v2/FROZEN_CORE_PROTOCOL_V1_2026-10-24.json
      - .github/workflows/afras-v2-stage18-engine-tests.yml

permissions:
  contents: read

jobs:
  locked-engine-static-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reproducible CPU tools
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r stage17_v2/requirements-pilot.txt
      - name: Compile source and independent metric replay
        run: python -m compileall -q stage18_v2 stage17_v2
      - name: Test synthetic full-target stream, analysis support and hard test gate
        run: |
          python -m unittest discover -s stage18_v2 -p "test_*.py" -v
      - name: Never authorize confirmatory runs from CI
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("stage16_v2/FROZEN_CORE_PROTOCOL_V1_2026-10-24.json").read_text())
          assert r["full_execution_authorized"] is False
          assert not Path("stage18_v2/AUTHORIZED_GATE.json").exists()
          print("STAGE18_ENGINE_QA_ONLY__NO_NATIVE_HELDOUT_SCORING")
          PY
