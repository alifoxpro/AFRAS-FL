name: AFRAS V2 Chat18 independent official UCI native archive byte provenance
on:
  push:
    branches:
      - research/afras-v2-stage17-source-only-pilot-20261024
    paths:
      - .github/workflows/afras-v2-chat18-official-nine-member-byte-admission.yml
      - stage18_v2/compare_official_uci_nine_original_archives.py
      - stage18_v2/HISTORICAL_LOCAL_ORIGINAL_23_MEMBER_SHA256_CHAT6.json
permissions:
  contents: read
jobs:
  official-original-25-members:
    name: Verify published public UCI 25 original members; compare 9 wrapper SHA; ZERO heldout scoring
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download the original publicly released UCI transport
        run: |
          set -euxo pipefail
          mkdir -p stage18_chat18
          curl --fail --location --retry 3 --retry-delay 10 \
            --speed-time 90 --speed-limit 1024 --max-time 1800 \
            -o "$RUNNER_TEMP/uci_original.zip" \
            'https://archive.ics.uci.edu/static/public/442/detection+of+iot+botnet+attacks+n+baiot.zip'
          echo "OFFICIAL_UCI_TRANSPORT_SHA"
          sha256sum "$RUNNER_TEMP/uci_original.zip"
      - name: Reconstruct all NINE canonical originals from 25 public source members (no ML)
        run: |
          set -euxo pipefail
          python stage18_v2/compare_official_uci_nine_original_archives.py \
            --official-outer "$RUNNER_TEMP/uci_original.zip" \
            --historical-original-manifest \
              stage18_v2/ORIGINAL_NINE_LOCAL_ZIP_HASH_MANIFEST_2026-10-24.json \
            --output-root "$RUNNER_TEMP/afras_chat18_reconstructed"
          cp "$RUNNER_TEMP/afras_chat18_reconstructed/uci_original_native_member_comparison_receipt.json" \
            stage18_chat18/uci_original_native_member_comparison_receipt.json
          cp "$RUNNER_TEMP/afras_chat18_reconstructed/PUBLISHER_UCI_NINE_REPACKAGED_ZIPS_CANDIDATE_MANIFEST__NOT_AUTHORIZED.json" \
            stage18_chat18/PUBLISHER_UCI_NINE_ZIPS_CANDIDATE_MANIFEST__NOT_AUTHORIZED.json
          python stage18_v2/verify_original_nine_zip_bytes.py \
            --source-root "$RUNNER_TEMP/afras_chat18_reconstructed/rebuilt_official_device_archives" \
            --manifest stage18_chat18/PUBLISHER_UCI_NINE_ZIPS_CANDIDATE_MANIFEST__NOT_AUTHORIZED.json \
            --receipt stage18_chat18/PUBLISHER_UCI_NINE_REPACKAGED_BYTES_CHECK__NOT_AUTHORIZED.json
      - name: Cross-match 23 historical original user-local member SHA values against new official UCI bytes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          prior=json.loads(Path("stage18_v2/HISTORICAL_LOCAL_ORIGINAL_23_MEMBER_SHA256_CHAT6.json").read_text())
          current=json.loads(Path("stage18_chat18/uci_original_native_member_comparison_receipt.json").read_text())
          current_members={m["name"]:m for dev in current["reconstructed_device_reports"]
                           for m in dev["native_members_from_official_transport"]}
          expected=prior["entries"]
          assert len(expected)==23 and len(current_members)==25
          confirmed=[]
          for entry in expected:
              x=current_members[entry["native_member"]]
              assert x["source_member_sha256"]==entry["prior_local_original_member_sha256"],entry["native_member"]
              assert x["source_member_bytes"]==entry["member_size_bytes"],entry["native_member"]
              confirmed.append(entry["native_member"])
          assert len(set(confirmed))==23
          # Ennio originals not in Chat6's 23-member user-local comparison.
          missing=sorted(set(current_members)-set(confirmed))
          assert missing==["Ennio_Doorbell/benign_traffic.csv","Ennio_Doorbell/gafgyt_attacks.rar"]
          current["historical_local_member_equality"]={
              "status":"23_OF_23_HISTORICAL_CHAT6_LOCAL_MEMBERS_MATCH_CURRENT_OFFICIAL_UCI_DOWNLOAD",
              "members_checked":23,"matches":23,
              "not_locally_comparable_Ennio_members":missing,
              "all_25_present_in_official_source":True,
              "fresh_user_library_original_zip_sha_completed":False
          }
          Path("stage18_chat18/uci_original_native_member_comparison_receipt.json").write_text(
              json.dumps(current,indent=2)+"\n")
          print("CHAT18_PRIOR_LOCAL_23_OF_23_NATIVE_MEMBER_SHA256_VS_FRESH_OFFICIAL_UCI_PASS",
                "Ennio_original_local_members_not_independently_compared",len(missing),flush=True)
          PY
      - name: Explicit checks (25 original public members, zero target result or fake approval)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('stage18_chat18/uci_original_native_member_comparison_receipt.json')
          r=json.loads(p.read_text())
          assert r['official_native_device_count']==9
          assert r['official_native_member_count']==25
          assert r['downloaded_original_transport_sha256']=='64929678b081d8e579a8d7c488cf11cc588403f282d5fb065b4156edbd55de9b'
          assert 0<=r['historical_outer_zip_exact_matches']<=9
          m=json.loads(Path('stage18_chat18/PUBLISHER_UCI_NINE_ZIPS_CANDIDATE_MANIFEST__NOT_AUTHORIZED.json').read_text())
          check=json.loads(Path('stage18_chat18/PUBLISHER_UCI_NINE_REPACKAGED_BYTES_CHECK__NOT_AUTHORIZED.json').read_text())
          import hashlib
          mdig=hashlib.sha256(Path('stage18_chat18/PUBLISHER_UCI_NINE_ZIPS_CANDIDATE_MANIFEST__NOT_AUTHORIZED.json').read_bytes()).hexdigest()
          assert mdig==r['provisional_unapproved_publisher_repacked_manifest_sha256']
          assert len(m["local_archives"])==9 and m["human_authorization_granted"] is False
          assert m["record_status"]=="UNAPPROVED_PUBLISHER_UCI_NATIVE_MEMBERS_REPACKAGED_NINE_SOURCE_WRAPPERS"
          assert check["original_zips_verified"]==9 and check["human_scientific_approval_created"] is False
          assert check["original_source_manifest_sha256"]==mdig
          assert r['current_user_Library_zip_bytes_read'] is False
          assert r['full_nine_local_zip_admission_of_user_library_bytes'] is False
          assert r['actual_native_test_rows_scored']==0
          assert r['research_authorization_granted'] is False
          assert all(x['native_member_count'] in (2,3)
                     for x in r['reconstructed_device_reports'])
          print("CHAT18_OFFICIAL_PUBLIC_UCI_25_NATIVE_MEMBER_HASH_PROVENANCE_PASS",
                "historical_original_outer_wrapper_matches",
                r['historical_outer_zip_exact_matches'],"/9",
                "USER_LIBRARY_RAW_BYTES_REHASHED",False,
                "MODEL_TARGET_RESULTS",0,flush=True)
          PY
      - name: Upload small admission receipt ONLY, no native data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afras-chat18-uci-25-native-member-rebuild-versus-original-nine-zip-audit
          path: |
            stage18_chat18/uci_original_native_member_comparison_receipt.json
            stage18_chat18/PUBLISHER_UCI_NINE_ZIPS_CANDIDATE_MANIFEST__NOT_AUTHORIZED.json
            stage18_chat18/PUBLISHER_UCI_NINE_REPACKAGED_BYTES_CHECK__NOT_AUTHORIZED.json
          if-no-files-found: warn
          retention-days: 15
