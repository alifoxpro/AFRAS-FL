name: Strict split unit tests
on:
  push:
    branches:
      - fix/mdpi-scientific-audit-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-split:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python source
        run: python -m py_compile scripts/data/split_records_leakfree.py scripts/data/strict_manifest.py scripts/training/train_mamba_strict.py scripts/training/preflight_real_training.py tests/test_training_preflight.py scripts/training/strict_fed_core.py scripts/training/train_federated_strict.py scripts/data/strict_test_guard.py scripts/data/label_evidence.py scripts/data/audit_original_csvs.py scripts/data/prepare_official_dataset_archive.py tests/test_prepare_official_dataset_archive.py scripts/data/check_cic_portals.py tests/test_cic_portal_status.py scripts/data/review_raw_category_mapping.py scripts/data/unify_features_v2.py tests/test_unify_features_v2.py tests/test_original_csv_audit.py tests/test_review_raw_mapping.py scripts/data/feature_provenance.py scripts/data/select_features_train_only.py scripts/evaluation/evaluate_strict_test.py tests/test_label_evidence.py tests/test_train_feature_provenance.py scripts/analysis/audit_mdpi_claims.py tests/test_mdpi_claim_audit.py tests/test_strict_test_guard.py tests/test_split_records.py tests/test_strict_manifest.py tests/test_strict_stage4_core.py
      - name: Run synthetic partition tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
