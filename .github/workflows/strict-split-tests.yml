name: Strict split unit tests
on:
  push:
    branches:
      - fix/mdpi-scientific-audit-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-split:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python source
        run: python -m py_compile scripts/data/split_records_leakfree.py scripts/data/strict_manifest.py scripts/training/train_mamba_strict.py scripts/training/strict_fuzzy_core.py tests/test_strict_fl_fuzzy_science.py scripts/training/preflight_real_training.py tests/test_training_preflight.py scripts/training/strict_fed_core.py scripts/training/train_federated_strict.py scripts/data/strict_test_guard.py scripts/data/label_evidence.py scripts/data/audit_original_csvs.py scripts/data/prepare_official_dataset_archive.py tests/test_prepare_official_dataset_archive.py scripts/data/check_cic_portals.py tests/test_cic_portal_status.py scripts/data/review_raw_category_mapping.py scripts/data/unify_features_v2.py tests/test_unify_features_v2.py tests/test_original_csv_audit.py tests/test_review_raw_mapping.py scripts/data/feature_provenance.py scripts/data/select_features_train_only.py scripts/evaluation/evaluate_strict_test.py scripts/analysis/audit_metrics_statistics.py tests/test_metrics_statistics_audit.py scripts/analysis/audit_submission_readiness.py tests/test_submission_readiness.py scripts/analysis/audit_mdpi_source_package.py tests/test_mdpi_source_package.py tests/test_label_evidence.py tests/test_train_feature_provenance.py scripts/analysis/audit_mdpi_claims.py tests/test_mdpi_claim_audit.py tests/test_strict_test_guard.py tests/test_split_records.py tests/test_strict_manifest.py tests/test_strict_stage4_core.py
      - name: Run synthetic partition tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Audit historical manuscript statistics without changing the paper
        run: |
          python scripts/analysis/audit_metrics_statistics.py --manuscript paper/main.tex --output /tmp/afras_manuscript_statistics_audit.json
          python -c 'import json; d=json.load(open("/tmp/afras_manuscript_statistics_audit.json")); print("Scientific audit (non-training):", d["critical_count"], "critical findings,", len(d["findings"]), "total findings"); print("Seed statistics:", d["seed_level_statistics_status"])'

      - name: Store source-only manuscript statistics audit (not experiment results)
        uses: actions/upload-artifact@v4
        with:
          name: mdpi-source-statistical-audit
          path: /tmp/afras_manuscript_statistics_audit.json
          retention-days: 30
          if-no-files-found: error

      - name: Final scientific readiness audit — expected non-ready until original evidence exists
        run: |
          python scripts/analysis/audit_submission_readiness.py --target-journal mdpi-ai --repo-root . --output /tmp/afras_submission_readiness.json
          python -c 'import json; x=json.load(open("/tmp/afras_submission_readiness.json")); assert x["readiness"] == "NOT_READY_FOR_SUBMISSION", "Unexpected ready status: investigate immediately"; assert x["counts"]["blocked"] > 0, "Missing evidentiary blockers"; assert all(not g["evidence"].get("test_opened",False) for g in x["gates"]); print("FINAL SCIENTIFIC SUBMISSION STATUS:", x["readiness"], "| BLOCKED:", x["counts"]["blocked"], "| MANUAL REVIEW:", x["counts"]["independent_review_required"], "| STATIC IMPLEMENTATION ONLY:", x["counts"]["implemented_static_only"])'
      - name: Save final readiness checklist, not performance results
        uses: actions/upload-artifact@v4
        with:
          name: final-scientific-readiness-checklist
          path: /tmp/afras_submission_readiness.json
          retention-days: 30
          if-no-files-found: error

      - name: Inspect MDPI AI LaTeX source dependencies (no compilation or manuscript edits)
        run: |
          python scripts/analysis/audit_mdpi_source_package.py --repo-root . --output /tmp/afras_mdpi_package_inventory.json
          python -c 'import json; r=json.load(open("/tmp/afras_mdpi_package_inventory.json")); assert r["manuscript_class"] == "IEEEtran", "Unexpected source class, review workflow assumptions"; print("MDPI PACKAGE:", r["status"], "| figures:", r["figure_references"], "| missing:", r["figure_files_missing"], "| undefined citations:", len(r["undefined_citation_keys"]), "| journal class:", r["manuscript_class"])'
      - name: Upload source-only LaTeX dependency inventory
        uses: actions/upload-artifact@v4
        with:
          name: mdpi-latex-dependency-inventory
          path: /tmp/afras_mdpi_package_inventory.json
          retention-days: 30
          if-no-files-found: error
