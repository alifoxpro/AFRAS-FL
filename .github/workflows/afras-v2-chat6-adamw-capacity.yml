name: AFRAS V2 Chat6 official UCI source-only AdamW capacity test

on:
  push:
    branches:
      - research/afras-v2-stage17-source-only-pilot-20261024
    paths:
      - .github/workflows/afras-v2-chat6-adamw-capacity.yml

permissions:
  contents: read

jobs:
  source-only-adamw-capacity:
    name: Real native UCI source-only AdamW feasibility, not held-out LODO
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: CPU torch scientific dependencies
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r stage17_v2/requirements-pilot.txt
          python -m compileall -q stage17_v2
          python -c 'import ctypes.util; assert ctypes.util.find_library("archive")'
      - name: Download publicly hosted original UCI source archive
        run: |
          set -euxo pipefail
          curl --fail --location --retry 3 --retry-delay 10 \
            --speed-time 90 --speed-limit 1024 --max-time 1800 \
            --output "$RUNNER_TEMP/uci_outer.zip" \
            'https://archive.ics.uci.edu/static/public/442/detection+of+iot+botnet+attacks+n+baiot.zip'
          mkdir -p "$RUNNER_TEMP/afras_sources" stage17_v2_chat6_optimizer
      - name: Stage eight source members, preserving outer-target exclusion
        run: |
          set -euxo pipefail
          python stage17_v2/prepare_uci_public_sources.py \
            --outer-zip "$RUNNER_TEMP/uci_outer.zip" \
            --source-root "$RUNNER_TEMP/afras_sources" \
            --heldout Ennio_Doorbell \
            --validation Samsung_SNH_1011_N_Webcam \
            --record stage17_v2_chat6_optimizer/source_provenance.json
          python - <<'PY'
          import json
          r=json.load(open("stage17_v2_chat6_optimizer/source_provenance.json"))
          assert r["outer_archive_sha256"]=="64929678b081d8e579a8d7c488cf11cc588403f282d5fb065b4156edbd55de9b"
          assert r["heldout_member_contents_opened"] is False
          print("ORIGINAL_UCI_BYTES_MATCH",r["outer_archive_sha256"])
          PY
      - name: Execute source-only MLP learnability diagnostic
        run: |
          set -euxo pipefail
          python stage17_v2/diagnose_optimizer_capacity.py \
            --source-root "$RUNNER_TEMP/afras_sources" \
            --heldout Ennio_Doorbell \
            --validation Samsung_SNH_1011_N_Webcam \
            --output stage17_v2_chat6_optimizer/adamw_real_source_capacity.json
      - name: Upload diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afras-v2-chat6-real-source-only-adamw-capacity-evidence
          path: stage17_v2_chat6_optimizer/*.json
          retention-days: 7
          if-no-files-found: warn
