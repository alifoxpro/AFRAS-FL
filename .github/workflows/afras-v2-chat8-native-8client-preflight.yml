name: AFRAS V2 Chat8 real eight-client source-only native preflight
on:
  push:
    branches:
      - research/afras-v2-stage17-source-only-pilot-20261024
    paths:
      - .github/workflows/afras-v2-chat8-native-8client-preflight.yml
permissions:
  contents: read

jobs:
  one-eight-client-preflight:
    name: Eight source clients, native 30k/device, FedAvg 1-round training, NO heldout evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native RAR and CPU PyTorch
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r stage17_v2/requirements-pilot.txt
          python -m compileall -q stage18_v2 stage17_v2
          python -c 'import ctypes.util; assert ctypes.util.find_library("archive")'
      - name: Acquire public original UCI dataset
        run: |
          set -euxo pipefail
          curl --fail --location --retry 3 --retry-delay 10 \
            --speed-time 90 --speed-limit 1024 --max-time 1800 \
            -o "$RUNNER_TEMP/uci_original.zip" \
            'https://archive.ics.uci.edu/static/public/442/detection+of+iot+botnet+attacks+n+baiot.zip'
          mkdir -p "$RUNNER_TEMP/afras_native_source" stage18_v2_chat8_artifacts
      - name: Verify official public bytes and repack only eight source members
        run: |
          set -euxo pipefail
          python stage17_v2/prepare_uci_public_sources.py \
            --outer-zip "$RUNNER_TEMP/uci_original.zip" \
            --source-root "$RUNNER_TEMP/afras_native_source" \
            --heldout Ennio_Doorbell \
            --validation Samsung_SNH_1011_N_Webcam \
            --record stage18_v2_chat8_artifacts/source_member_provenance.json
          python - <<'PY'
          import json
          r=json.load(open("stage18_v2_chat8_artifacts/source_member_provenance.json"))
          assert r["outer_archive_sha256"]=="64929678b081d8e579a8d7c488cf11cc588403f282d5fb065b4156edbd55de9b"
          assert r["heldout_member_contents_opened"] is False
          assert len(r["device_files"]) == 8
          print("PUBLIC_SOURCE_TRANSPORT_AND_MEMBERS_VERIFIED",flush=True)
          PY
      - name: Execute Stage18 eight-client real source-only AdamW software preflight
        run: |
          set -euxo pipefail
          python stage18_v2/lodo_engine.py \
            --mode preflight --source-root "$RUNNER_TEMP/afras_native_source" \
            --heldout Ennio_Doorbell --method FedAvg --seed 3107 \
            --preflight-cap 30000 --preflight-rounds 1 --preflight-epochs 1 \
            --output-dir stage18_v2_chat8_artifacts/fedavg_eight_source_preflight
      - name: Fail if heldout target has been evaluated or training clients not exactly eight
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path("stage18_v2_chat8_artifacts/fedavg_eight_source_preflight")
          r=json.loads((base/"run_receipt.json").read_text())
          assert r["mode"]=="preflight"
          assert r["target_archive_opened"] is False
          assert r["target_test_scored"] is False
          assert r["target_results"] is None
          assert r["source_clients"]==8
          assert len(r["sampling"])==8
          assert set(x["sample_size"] for x in r["sampling"].values())=={30000}
          assert r["training"]["rounds"]==1
          assert r["training"]["local_epochs"]==1
          assert not list(base.glob("*target_predictions*"))
          assert not list(base.glob("*checkpoint*"))
          print("REAL_EIGHT_SOURCE_CLIENT_NATIVE_PREFLIGHT_PASS__ZERO_TARGET_INFERENCE",flush=True)
          PY
      - name: Store metadata only; no native raw records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afras-v2-chat8-eight-client-real-source-only-preflight
          path: |
            stage18_v2_chat8_artifacts/source_member_provenance.json
            stage18_v2_chat8_artifacts/fedavg_eight_source_preflight/run_receipt.json
          retention-days: 10
          if-no-files-found: warn
